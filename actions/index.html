    <table id="branch-actions">

        <td><a href="./draft-westerbaan-alldispatch-mpic.html" class="html draft-westerbaan-alldispatch-mpic" title="Multi-Perspective Issuance Corroboration (MPIC) Service  (HTML)">MPIC</a></td>
        <td><a href="./draft-westerbaan-alldispatch-mpic.txt" class="txt draft-westerbaan-alldispatch-mpic" title="Multi-Perspective Issuance Corroboration (MPIC) Service  (Text)">plain text</a></td>
        <td>same as placeholder</td>

    <script>
window.onload = function() {
  var referrer_branch = 'placeholder';
  // e.g., "https://github.com/user/repo/tree/placeholder"
  var chunks = document.referrer.split("/");
  if (chunks[2] === 'github.com' && chunks[5] === 'tree') {
    referrer_branch = chunks[6];
  }
  let branch = document.querySelector('#branch-' + referrer_branch);
  let h = document.location.hash.substring(1);
  if (h === 'show') {
    document.location.hash = '#' + branch.id;
  } else if (branch && h.startsWith('go')) {
    let e = branch.querySelector(h.substring(2));
    if (e && e.href) {
      document.location = e.href;
    }
  }
};
    </script>
